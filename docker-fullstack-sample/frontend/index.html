<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Docker Full Stack Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 100px auto;
            text-align: center;
        }
        button {
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
        }
        #result {
            margin-top: 30px;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <h1>Docker Frontend + Backend</h1>
    <p>Frontend is running inside Nginx.</p>
    <button onclick="callBackend()">Call Backend API</button>
    <div id="result"></div>

    <script>
    async function callBackend() {
        try {
            const response = await fetch("/api/hello");
            const data = await response.json();
            document.getElementById("result").innerHTML = data.message;
        } catch (error) {
            document.getElementById("result").innerHTML =
                "Backend connection failed";
        }
    }
    </script>
</body>
</html>
